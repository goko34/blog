services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: blogfrontend
    ports:
      - "81:81"
    volumes:
      - .:/var/www
    networks:
      - blogfrontend-network
    environment:
      - LC_ALL=tr_TR.UTF-8
      - LANG=tr_TR.UTF-8

networks:
  blogfrontend-network:
    driver: bridge
